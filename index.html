<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="作業日報">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>作業日報（一般）</title>
<style>
:root{
  color-scheme:light;
  --ta:#1F4D2B;        /* 稲の深緑：主色 */
  --ta-soft:#DCE8D5;
  --wara:#E8C547;      /* 藁：送信ボタン */
  --tsuchi:#2E2A24;    /* 土：文字 */
  --sora:#F1F4EE;      /* 背景 */
  --line:#C9D2C2;
  --alert:#B4441A;     /* 未分類・警告 */
  --alert-soft:#F8E1D4;
  --muted:#65655A;
  --card:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sora);color:var(--tsuchi);
  font:18px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  padding-bottom:calc(170px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--wara);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--ta);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.top-row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.who{flex:1;font-size:20px;font-weight:700;background:none;border:0;text-align:left;color:#fff;padding:4px 0}
.who small{font-weight:400;opacity:.8;font-size:14px;margin-left:6px}
.gear{width:48px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:22px}
.datebar{display:flex;align-items:center;gap:8px;max-width:640px;margin:8px auto 0}
.datebar .nav{width:52px;height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:22px}
.datebox{flex:1;position:relative;height:52px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:700}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.badge{font-size:13px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--wara);color:var(--tsuchi)}
.badge.warn{background:var(--alert);color:#fff}
main{max-width:640px;margin:0 auto;padding:4px 12px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.blk h2{font-size:17px;margin:0 0 10px;color:var(--ta)}
.banner{background:var(--alert-soft);border:2px solid var(--alert);border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;align-items:center;gap:10px;font-weight:700}
.banner span{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--line);background:#fff;font-size:17px;font-weight:600}
.chip.on{background:var(--ta);border-color:var(--ta);color:#fff}
.chip.alert.on{background:var(--alert);border-color:var(--alert)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.btn{min-height:56px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--ta);background:#fff;color:var(--ta);padding:0 16px}
.btn.full{width:100%}
.btn.solid{background:var(--ta);color:#fff}
.btn.small{min-height:44px;font-size:16px;padding:0 12px}
.btn.alert{border-color:var(--alert);color:var(--alert)}
.attline{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:19px;font-weight:700}
.attline span{white-space:nowrap}
.attline em{font-style:normal;font-size:14px;color:var(--ta);text-align:right;line-height:1.3}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.f{min-width:0}
label.f{display:block;font-size:14px;color:var(--muted);font-weight:600}
input[type=time]{display:block;width:100%;min-width:0;max-width:100%;min-height:56px;font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;color:var(--tsuchi);margin-top:4px}
textarea{width:100%;min-height:80px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:#fff;color:var(--tsuchi)}
.gap10{height:10px}
/* 1日の帯：このアプリの要 */
.tlwrap{margin-top:4px}
.tl{position:relative;height:46px;border-radius:8px;background:#E4E8DF;overflow:hidden}
.seg{position:absolute;top:0;bottom:0}
.seg.work{background:var(--ta)}
.seg.gap{background:repeating-linear-gradient(135deg,var(--alert) 0 7px,#D5774E 7px 14px)}
.seg.deduct{background:#B8BEB0}
.seg.paid{background:#A8C49A}
.seg.outside{background:#7C8C98}
.seg.trip{background:repeating-linear-gradient(90deg,#B8BEB0 0 10px,#CFD4C8 10px 20px)}
.gtitle{margin:12px 0 6px;font-size:15px;font-weight:700;color:var(--muted)}
.gtitle:first-child{margin-top:0}
.breaks{margin-top:12px;padding:14px;border-radius:12px;background:var(--sora)}
.btitle{margin:0 0 8px;font-size:17px;font-weight:700;color:var(--ta)}
.brow{margin-top:10px}
.blabel{margin:0 0 6px;font-size:17px;font-weight:700}
.blabel span{margin-left:8px;font-size:14px;font-weight:600;color:var(--muted)}
.bmin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bmin2{grid-template-columns:repeat(2,minmax(0,1fr))}
.breason{border-color:var(--alert)}
.bmin .chip{min-height:48px;padding:0 4px;font-size:16px}
.tripq{margin-top:12px;padding:12px;border-radius:12px;background:var(--sora);border:2px solid transparent}
.tripq.need{border-color:var(--alert);background:var(--alert-soft)}
.tripq>b{display:block;font-size:18px;margin-bottom:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn .chip{min-height:56px;font-size:19px}
.leg{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.leg-h{display:flex;align-items:center;justify-content:space-between}
.leg-h b{color:var(--ta)}
.leg-row{display:block}
.mins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.mins .chip{min-height:48px;padding:0 4px;font-size:15px}
.tripq .btn{margin-top:12px}
.bnotice{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--wara);color:var(--tsuchi);font-size:20px;font-weight:800;line-height:1.4}
.bnotice small{display:block;margin-top:4px;font-size:14px;font-weight:600}
.tripnote{margin:10px 0 0;font-size:14px;color:var(--muted)}
.ticks{position:relative;height:20px;font-size:12px;color:var(--muted);margin-top:2px}
.ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{text-align:center;padding:6px 2px;border-radius:10px;background:var(--sora)}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat small{font-size:13px;color:var(--muted)}
.stat.bad{background:var(--alert-soft)}
.stat.bad b{color:var(--alert)}
.ot{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#FFF3C4;font-size:19px;font-weight:700}
.ot span{display:block;margin-top:4px;font-size:14px;font-weight:600;color:var(--muted)}
.warns{margin:10px 0 0;padding:0;list-style:none;font-size:15px;color:var(--alert);font-weight:600}
.warns li{margin-top:4px}
/* 作業カード */
.card{border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px;background:#fff}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h .n{font-weight:800;color:var(--ta);font-size:18px}
.card-h .d{flex:1;font-size:15px;color:var(--muted)}
.del{min-height:40px;border:0;background:none;color:var(--muted);font-size:15px;text-decoration:underline}
.pick{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 14px;font-size:19px;font-weight:700;text-align:left;margin-bottom:10px}
.pick.empty{color:var(--muted);font-weight:600;border-style:dashed}
.times{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end;margin-top:10px}
.times .sep{padding-bottom:14px;color:var(--muted)}
details.memo{margin-top:8px}
details.memo summary{min-height:40px;display:flex;align-items:center;color:var(--muted);font-size:15px}
.addtask{width:100%;min-height:60px;border:2px dashed var(--ta);border-radius:14px;background:transparent;color:var(--ta);font-size:19px;font-weight:700}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;border:0;background:none;padding:0;font-size:17px;font-weight:700;color:var(--ta);text-align:left}
.fold span{color:var(--tsuchi);font-weight:600;font-size:16px}
/* 固定フッター */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(241,244,238,.97);border-top:1px solid var(--line);
  padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
.foot-in{max-width:640px;margin:0 auto}
.sendstat{font-size:14px;min-height:22px;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.sendstat.ok{color:var(--ta);font-weight:700}
.sendstat.wait{color:var(--alert);font-weight:700}
.sendstat button{margin-left:auto}
.send{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--wara);color:var(--tsuchi);font-size:21px;font-weight:800;box-shadow:0 2px 0 #B8962A}
.send:active{transform:translateY(1px);box-shadow:none}
.send[disabled]{opacity:.6}
.linebtn{width:100%;min-height:44px;margin-top:6px;border:0;background:none;color:var(--muted);font-size:15px;text-decoration:underline}
/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(20,25,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-in{max-width:640px;margin:0 auto}
.sheet h3{margin:0 0 12px;font-size:19px}
.zlist{margin-top:10px}
.zrow{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;margin-bottom:8px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.zrow b{flex:1;font-size:19px;color:var(--tsuchi)}
.zrow span{font-size:14px;color:var(--muted)}
.zrow i{min-width:26px;height:26px;border-radius:13px;background:var(--wara);color:var(--tsuchi);font-style:normal;font-size:14px;font-weight:700;line-height:26px;text-align:center}
.zrow em{font-style:normal;font-size:22px;color:var(--muted)}
.zhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.zhead h3{flex:1;margin:0}
.zback{min-height:44px;border:0;background:none;color:var(--ta);font-size:17px;font-weight:700;padding:0 4px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fgrid .chip{min-height:60px;padding:0 4px;font-size:18px}
.cattabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;position:sticky;top:-16px;background:#fff;padding:4px 0 8px;z-index:1}
.cattab{min-height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17px;font-weight:700;position:relative}
.cattab.on{background:var(--ta);border-color:var(--ta);color:#fff}
.cattab i{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--wara);color:var(--tsuchi);font-style:normal;font-size:13px;line-height:22px}
.zone{margin:14px 0 6px;display:flex;align-items:center;justify-content:space-between}
.zone b{font-size:16px;color:var(--ta)}
.sheet-foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 4px;margin-top:12px}
.whobtn{display:block;width:100%;min-height:60px;margin:8px 0;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:20px;font-weight:700;text-align:left;padding:0 16px}
.whobtn small{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
.kv{font-size:14px;color:var(--muted);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:var(--tsuchi);color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;font-weight:700;max-width:90vw;text-align:center}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<footer class="foot"><div class="foot-in" id="foot"></div></footer>
<div id="sheetRoot"></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   作業日報 v2  — 入力はシンプル、裏側は精密
   ・勤怠時間／作業実績時間／未分類時間を1分単位の集合で計算
   ・日報は全員が自分の分を提出（共同作業者は照合用の参考データ）
   ・outbox＋revision＋reportId で二重登録を防止
   ===================================================================== */
const APP_VERSION = '2.3.0-general';
const LS = 'nippoG:';   // 同じ github.io 上の他アプリと保存領域を分ける

/* ---------- 会社設定の初期値（config.json があれば上書き） ---------- */
const DEFAULT_CONFIG = {
  version: 'builtin-2026-09-20',
  companyName: 're:zenith 新鮮組',
  gasUrl: '',
  unclassWarnMin: 15,
  fillMaxMin: 30,      // これより長い空きは「移動・準備」で自動では埋めない
  // 遠方（車で移動）：研修生は行き・帰りの移動時間を休憩として扱う。一般作業員（運転）は作業時間（移動・準備）
  // 車移動の数え方（研修生）
  //   mode 'work'    : 移動時間は労働時間（作業時間）として記録し、休憩にはしない ← 現在の会社ルール
  //   mode 'add'     : 移動時間をすべて休憩として、通常の休憩に追加
  //   mode 'replace' : replaceBreaks の休憩をなくし、移動時間をすべて休憩に
  //   mode 'partial' : partial.breakName の休憩のうち travelMin 分を移動中に取ったことにする（残りの移動は作業時間）
  trip: { legMin: 20, mode: 'work', replaceBreaks: [], partial: { breakName: '午後休憩', travelMin: 20, fromLeg: 'last' } },
  closingDay: 15,
  schedules: {
    normal: { label: '通常勤務', label_id: 'Normal', start: '08:00', end: '17:00', breaks: [
      { name: '午前休憩', s: '10:00', e: '10:30', rule: { trainee: { type: 'deduct' }, general: { type: 'paid', min: 15 } } },
      { name: '昼休憩',   s: '12:00', e: '13:00', rule: { trainee: { type: 'deduct' }, general: { type: 'deduct' } } },
      { name: '午後休憩', s: '15:00', e: '15:30', rule: { trainee: { type: 'deduct' }, general: { type: 'paid', min: 15 } } }
    ]},
    summer: { label: 'サマータイム', label_id: 'Musim panas', start: '05:00', end: '14:00', breaks: [
      { name: '午前休憩', s: '07:00', e: '07:30', rule: { trainee: { type: 'deduct' }, general: { type: 'paid', min: 15 } } },
      { name: '昼休憩',   s: '09:00', e: '10:00', rule: { trainee: { type: 'deduct' }, general: { type: 'deduct' } } },
      { name: '午後休憩', s: '12:00', e: '12:30', rule: { trainee: { type: 'deduct' }, general: { type: 'paid', min: 15 } } }
    ]}
  },
  workers: [
    { id: 'W001', name: '野副', type: 'general' },
    { id: 'W002', name: '田中', type: 'general' },
    { id: 'W003', name: 'ブディ', type: 'trainee' }
  ],
  // 残業：終業時刻を過ぎた分を、30分単位で切り上げ（夕方の休憩なし）
  overtime: { unit: 30, round: 'ceil' },
  // その日に選べる休憩（設定_休憩 の休憩名と合わせる）
  // 休憩は「決めた長さを必ず取る」か「なし（理由を書く）」の2択
  breakPicker: { am: '午前休憩', pm: '午後休憩', optionsByType: { general: [15, 0], trainee: [30, 0] }, default: { trainee: 30, general: 15 } },
  // 場所の種類（タブ）。fields の cat と同じ名前にする。cat が無い場所は「圃場」
  fieldCats: [
    { id: '圃場', label: '圃場', label_id: 'Sawah', icon: '🌾' },
    { id: 'ハウス', label: 'ハウス', label_id: 'Rumah kaca', icon: '🏠' },
    { id: '倉庫', label: '倉庫', label_id: 'Gudang', icon: '🏚' }
  ],
  fields: [
    { id: 'F-S1', name: '南1', zone: '南', area: 30 }, { id: 'F-S2', name: '南2', zone: '南', area: 30 },
    { id: 'F-S3', name: '南3', zone: '南', area: 25 }, { id: 'F-S4', name: '南4', zone: '南', area: 25 },
    { id: 'F-S5', name: '南5', zone: '南', area: 40 }, { id: 'F-N1', name: '北1', zone: '北', area: 30 },
    { id: 'F-N2', name: '北2', zone: '北', area: 30 }, { id: 'F-E1', name: '東1', zone: '東', area: 20 },
    { id: 'H-01', name: 'ハウス1', cat: 'ハウス', zone: 'ハウス', area: 5 }, { id: 'H-02', name: 'ハウス2', cat: 'ハウス', zone: 'ハウス', area: 5 },
    { id: 'P-WACHI', name: '和地倉庫', cat: '倉庫', zone: '和地', area: 0 }
  ],
  tasks: [
    { id: 'T01', name: '稲刈り', name_id: 'Panen padi' },
    { id: 'T02', name: '田植え', name_id: 'Tanam padi' },
    { id: 'T03', name: '代かき', name_id: 'Meratakan sawah' },
    { id: 'T04', name: '耕起', name_id: 'Membajak' },
    { id: 'T05', name: '草刈り', name_id: 'Potong rumput' },
    { id: 'T06', name: '水管理', name_id: 'Mengatur air' },
    { id: 'T07', name: '防除', name_id: 'Penyemprotan' },
    { id: 'T08', name: '施肥', name_id: 'Pemupukan' },
    { id: 'T09', name: '乾燥調製', name_id: 'Pengeringan' },
    { id: 'T10', name: '野菜管理', name_id: 'Perawatan sayur' },
    { id: 'T12', name: '機械整備', name_id: 'Perawatan mesin' },
    { id: 'T90', name: '移動・準備', name_id: 'Pindah/Persiapan', noField: true, filler: true },
    { id: 'T99', name: 'その他', name_id: 'Lainnya' }
  ]
};

/* ---------- 言語 ---------- */
const INC_TYPES = ['damage', 'machine', 'fieldchg', 'otherrep'];   // 会社への報告の種類
const I18N = {
  ja: {
    today:'今日', notToday:'今日ではありません', status_normal:'通常', status_late:'遅刻', status_early:'早退', status_absent:'欠勤',
    work_hours:'勤務', edit:'変更', in:'出勤', out:'退勤', reason:'理由', attend:'勤怠', work:'作業', unclass:'未分類',

  coLast: () => { D.coworkers = store.get('lastCoworkers:' + ME, []).filter(id => workerById(id) && id !== ME); edited(); renderMain(); renderFoot(); },
  brk: b => { D.breaks[b.dataset.k] = Number(b.dataset.v); edited(); renderMain(); renderFoot(); },
  inc: b => { const k = b.dataset.v; D.incOn[k] = !D.incOn[k]; edited(); renderMain(); renderFoot(); },
  fillGap: () => { const f = fillerTask(); if (!f) return; const c = computeDay(D);
    c.gaps.filter(g => g[1] - g[0] >= 5 && g[1] - g[0] <= (CFG.fillMaxMin || 30)).forEach(g => D.tasks.push({ id: uid(), typeId: f.id, fieldIds: [], start: toHM(g[0]).padStart(5, '0'), end: toHM(g[1]).padStart(5, '0'), note: '' }));
    D.tasks.sort((a, b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999)); edited(); renderMain(); renderFoot(); },
  tripNo: () => { D.trip.answered = true; D.trip.on = false; edited(); renderMain(); renderFoot(); },
  tripYes: () => { const sch = CFG.schedules[D.schedule] || CFG.schedules.normal; D.trip.answered = true; D.trip.on = true;
    if (!D.trip.legs.length) { const L = legDefault();
      const inM = Math.max(toMin(D.attendance.in) ?? toMin(sch.start), toMin(sch.start)), outM = toMin(D.attendance.out) ?? toMin(sch.end);
      D.trip.legs = [{ id: uid(), start: toHM(inM).padStart(5, '0'), min: L }, { id: uid(), start: toHM(Math.max(inM, outM - L)).padStart(5, '0'), min: L }]; }
    if (!D.trip.passengers.length) D.trip.passengers = store.get('lastPassengers:' + ME, []).filter(id => workerById(id));
    edited(); renderMain(); renderFoot(); },
  legMin: b => { D.trip.legs[+b.dataset.i].min = +b.dataset.v; edited(); renderMain(); renderFoot(); },
  legDel: b => { D.trip.legs.splice(+b.dataset.i, 1); edited(); renderMain(); renderFoot(); },
  legAdd: () => { D.trip.legs.push({ id: uid(), start: '', min: legDefault() }); edited(); renderMain(); renderFoot(); },
  passenger: b => { const v = b.dataset.v, k = D.trip.passengers.indexOf(v); if (k >= 0) D.trip.passengers.splice(k, 1); else D.trip.passengers.push(v); store.set('lastPassengers:' + ME, D.trip.passengers); edited(); renderMain(); renderFoot(); },
  send: () => onSend(),
  line: () => { const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(lineText()); window.location.href = url; }
};
function gotoDate(ds) { if (!ds || ds > todayStr()) return; persist(); loadDraft(ds); UI.attOpen = false; UI.coOpen = false; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.classList.contains('sheet-bg') && e.target !== b) return; const f = ACT[b.dataset.act]; if (f) f(b, e); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'dateInput') { gotoDate(el.value); return; }
  if (el.dataset.leg) { D.trip.legs[+el.dataset.leg].start = el.value; sortLegs(); edited(); renderMain(); renderFoot(); return; }
  if (el.dataset.att) { D.attendance[el.dataset.att] = el.value; edited(); renderMain(); renderFoot(); return; }
  if (el.dataset.f === 'start' || el.dataset.f === 'end') { D.tasks[+el.dataset.i][el.dataset.f] = el.value; edited(); renderSummary(); renderFoot(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bnote) { D.breaks[el.dataset.bnote + 'Note'] = el.value; edited(); renderFoot(); return; }
  if (el.dataset.f === 'note') { D.tasks[+el.dataset.i].note = el.value; edited(); renderFoot(); }
  else if (el.dataset.g === 'statusNote') { D.statusNote = el.value; edited(); renderFoot(); }
  else if (el.dataset.inc) { D.incidents[el.dataset.inc] = el.value; edited(); renderFoot(); }
});

/* ---------- 再送のきっかけ（iPhoneはバックグラウンド送信ができないため） ---------- */
window.addEventListener('online', () => flushOutbox());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { if (D) persist(); return; }
  if (Date.now() - cfgLoadedAt > 10 * 60 * 1000) loadConfig(false);
  if (D && D.date !== todayStr() && !D.dirty && !hasContent(D)) { loadDraft(todayStr()); render(); }
  else if (D) renderTop();
  flushOutbox();
});
window.addEventListener('pagehide', () => { if (D) persist(); });
setInterval(() => { const ob = store.get('outbox', []); if (Array.isArray(ob) && ob.length) flushOutbox(); }, 60000);

/* ---------- 起動 ---------- */
(function boot() {
  LANG = store.get('lang', 'ja') === 'id' ? 'id' : 'ja';
  cleanupOldDrafts();
  if (ME && workerById(ME) && workerById(ME).type !== 'trainee') loadDraft(todayStr()); else ME = null;
  render();
  loadConfig(false);
  flushOutbox();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
